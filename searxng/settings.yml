# SearXNG settings for the Slacks local / self-host dev stack (FTY-165).
#
# This is a MINIMAL private-instance configuration. It starts from the upstream
# defaults and overrides only what Slacks' official-source search adapter
# (FTY-164) requires:
#
#   - JSON output format, which the adapter consumes at
#     GET /search?q=<sanitized item identity>&format=json;
#   - a CURATED engine set instead of the upstream default fan-out (FTY-436);
#   - a dev-only secret key (see the security note below).
#
# SearXNG runs as an INTERNAL backend tool on the compose network (service name
# `searxng`, container port 8080). It is NOT published to the host — see the
# port-exposure note in docker-compose.yml. The backend sends only sanitized
# item-identity queries (FTY-164); no personal context ever reaches this
# instance.

use_default_settings:
  engines:
    # CURATED ENGINE SET (FTY-436).
    #
    # Every adapter query is a plain `general`-category search, so SearXNG fans
    # it out to *all* engines enabled in that category. Upstream's defaults
    # enable ten (brave, currency, dictzone, duckduckgo, google, lingva,
    # mymemory translated, startpage, wikidata, wikipedia) — most useless for
    # nutrition lookup, and several of them (Google and Startpage first) answer
    # a self-hosted instance with a CAPTCHA / block wall. Those blocks are what
    # the backend sees as rate limiting.
    #
    # `keep_only` replaces that inherit-everything default with an explicit
    # short list, measured against this stack (see
    # docs/operations/local-dev-stack.md for the full measurement and the
    # rationale for each drop):
    #
    #   duckduckgo web — DuckDuckGo's HTML endpoint. Best branded-product and
    #                    UPC coverage of the candidates; keyless. NOT the same
    #                    engine as plain `duckduckgo` (the lite/JSON endpoint),
    #                    which CAPTCHA-walled every probe query and is one of
    #                    the engines this story drops.
    #   dogpile        — InfoSpace metasearch with a different backend mix;
    #                    carries roughly half the results on every probe query
    #                    and surfaces official brand product pages the others
    #                    miss. Never throttled this instance.
    #   mojeek         — small INDEPENDENT crawler (not a Bing/Google front
    #                    end), so the set keeps answering when the aggregators
    #                    cool off. Sparse on branded queries; contributes on
    #                    generic foods. After a burst of probe traffic it does
    #                    enter an `access denied` cooldown for a while and
    #                    recovers unaided — a soft per-IP limit, not a block
    #                    wall, and the other two carry the set meanwhile.
    #
    # `bing` was measured and REJECTED: redundant with `duckduckgo web`, and on
    # numeric UPC queries it injected unrelated results that outranked the real
    # product hits. See the dropped-engine table in the ops doc.
    #
    # Widening this list is a deliberate operator choice: add the engine's
    # upstream name here (and `disabled: false` below if it ships disabled).
    # Re-adding google/startpage/brave will reintroduce the upstream 429s.
    keep_only:
      - duckduckgo web
      - dogpile
      - mojeek

engines:
  # All three ship present-but-disabled upstream (none is part of the default
  # general fan-out), so the curated set opts into them explicitly. All three are
  # keyless — the self-host stack stays credential-free.
  - name: duckduckgo web
    disabled: false
  - name: dogpile
    disabled: false
  - name: mojeek
    disabled: false

server:
  # NON-SECRET DEV PLACEHOLDER — not a real secret, and safe to commit.
  #
  # This instance is private to the compose network and never exposed to the
  # host, so this key protects nothing that is reachable from outside the stack.
  # SearXNG requires the field to be set, so a fixed placeholder is used here
  # instead of the image's random per-boot key, keeping the dev stack
  # reproducible. If you ever expose this instance (this stack deliberately does
  # not), override it with a real random value via the ${SEARXNG_SECRET}
  # environment variable. Do NOT treat this value as a credential.
  secret_key: "slacks-dev-searxng-placeholder-not-a-secret"

  # Keep the bot limiter off: the only caller is the trusted backend on the
  # internal network, and the limiter would otherwise rate-limit / block it as a
  # "bot". Nothing on the public internet can reach this instance.
  limiter: false

  # This is a private instance, not a public search service.
  public_instance: false

search:
  # Enable the JSON API the FTY-164 adapter depends on. Upstream default is
  # [html] only; `json` must be added for the adapter's format=json request to
  # return results instead of an HTTP 403.
  formats:
    - html
    - json
